<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lightbox backdrop-click-to-close — Prototype</title>
<style>
  :root {
    --background: 0 0% 100%;
    --foreground: 222.2 84% 4.9%;
    --border: 214.3 31.8% 91.4%;
    --input: 214.3 31.8% 91.4%;
    --ring: 222.2 84% 4.9%;
    --muted-foreground: 215.4 16.3% 46.9%;
    --accent: 210 40% 96.1%;
    --accent-foreground: 222.2 47.4% 11.2%;
    --cancel: 0 0% 100%;
    --radius: 0.5rem;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: hsl(var(--foreground));
    background: hsl(var(--background));
  }
  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1rem;
  }
  .space-y-2 > * + * { margin-top: 0.5rem; }
  h3.section-title { font-size: 0.875rem; font-weight: 500; margin: 0; }
  p.muted { font-size: 0.875rem; color: hsl(var(--muted-foreground)); margin: 0; }
  .thumb-grid { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .thumb {
    overflow: hidden;
    border-radius: var(--radius);
    border: 1px solid hsl(var(--border));
    padding: 0;
    cursor: pointer;
    background: none;
    transition: opacity 0.15s;
    display: block;
  }
  .thumb:hover { opacity: 0.8; }
  .thumb:focus-visible { outline: none; box-shadow: 0 0 0 1px hsl(var(--ring)); }
  .thumb img { height: 5rem; width: 5rem; object-fit: cover; display: block; }
  .choose-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    border-radius: var(--radius);
    font-size: 0.75rem;
    font-weight: 500;
    height: 2rem;
    padding: 0 0.75rem;
    border: 1px solid hsl(var(--input));
    background: hsl(var(--cancel));
    box-shadow: 0 1px 2px 0 rgba(0,0,0,0.05);
    cursor: pointer;
  }
  .choose-btn:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }

  /* ---- Dialog primitives (apps/web/src/components/ui/dialog.tsx) ---- */
  .dialog-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: hsl(var(--background) / 0.8);
    backdrop-filter: blur(4px);
    display: none;
  }
  /* DialogContent as PhotoLightbox overrides it: fixed, full-bleed,
     h-screen w-screen, flex items-center justify-center, transparent,
     no border/shadow — this is the element the fix's onClick lands on. */
  .dialog-content {
    position: fixed;
    inset: 0;
    z-index: 50;
    height: 100vh;
    width: 100vw;
    display: none;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    box-shadow: none;
    outline: none;
  }
  .lightbox-open .dialog-overlay,
  .lightbox-open .dialog-content { display: flex; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .lightbox-img {
    max-height: 85vh;
    max-width: 90vw;
    border-radius: 0.375rem;
    object-fit: contain;
    display: block;
  }

  .chrome-btn {
    position: absolute;
    border-radius: 9999px;
    background: hsl(var(--background) / 0.8);
    padding: 0.5rem;
    color: hsl(var(--foreground));
    border: none;
    cursor: pointer;
    transition: background-color 0.15s;
    display: flex;
    line-height: 0;
  }
  .chrome-btn:hover { background: hsl(var(--background)); }
  .btn-close { top: 1rem; right: 1rem; }
  .btn-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
  .btn-next { right: 1rem; top: 50%; transform: translateY(-50%); }

  .counter-badge {
    position: absolute;
    bottom: 1rem;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 9999px;
    background: hsl(var(--background) / 0.8);
    padding: 0.25rem 0.75rem;
    font-size: 0.875rem;
    color: hsl(var(--foreground));
  }

  /* --- prototype-only annotation chrome, not part of the real UI --- */
  .proto-banner {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 60;
    background: #111827;
    color: #e5e7eb;
    font-size: 0.75rem;
    padding: 0.4rem 0.75rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    font-family: ui-monospace, monospace;
  }
  #event-log {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 70vw;
  }
  .backdrop-flash {
    position: fixed;
    inset: 0;
    z-index: 55;
    pointer-events: none;
    background: rgba(239, 68, 68, 0.12);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .backdrop-flash.show { opacity: 1; }
</style>
</head>
<body>
  <div class="proto-banner">
    <span>Prototype — lightbox-click-outside-close (fix applied)</span>
    <span id="event-log">click anywhere to test…</span>
  </div>

  <div class="page">
    <div class="space-y-2">
      <h3 class="section-title">Photos</h3>
      <div class="thumb-grid">
        <button type="button" class="thumb" aria-label="Open photo 1 of 3" onclick="openLightbox(0)">
          <img src="https://picsum.photos/seed/pcpart1/320/320" alt="Listing photo" />
        </button>
        <button type="button" class="thumb" aria-label="Open photo 2 of 3" onclick="openLightbox(1)">
          <img src="https://picsum.photos/seed/pcpart2/320/320" alt="Listing photo" />
        </button>
        <button type="button" class="thumb" aria-label="Open photo 3 of 3" onclick="openLightbox(2)">
          <img src="https://picsum.photos/seed/pcpart3/320/320" alt="Listing photo" />
        </button>
      </div>
      <input type="file" accept="image/*" multiple class="hidden" style="display:none" />
      <button type="button" class="choose-btn">⬆ Choose Photos</button>
    </div>
  </div>

  <!-- Dialog (Radix-based primitive, apps/web/src/components/ui/dialog.tsx) -->
  <div id="lightbox-root">
    <div class="dialog-overlay"></div>
    <!--
      DialogContent — fix (task T1) adds onClick={onClose} directly on this
      element. Its bounding box is h-screen/w-screen (the whole viewport),
      which is exactly why a plain "click outside DialogContent" never
      fired before: there was no outside. Now the backdrop *is*
      DialogContent, and clicking it closes directly, while the photo and
      the three buttons each stopPropagation() so their own click never
      reaches this handler.
    -->
    <div class="dialog-content" onclick="handleBackdropClick(event)">
      <h2 class="sr-only" id="lightbox-title">Listing photo <span id="counter-a">1</span> of 3</h2>

      <button type="button" class="chrome-btn btn-close" aria-label="Close" onclick="handleClose(event)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <button type="button" class="chrome-btn btn-prev" aria-label="Previous photo" onclick="handlePrev(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>

      <img id="lightbox-img" class="lightbox-img" src="" alt="Listing photo" onclick="handleImageClick(event)" />

      <button type="button" class="chrome-btn btn-next" aria-label="Next photo" onclick="handleNext(event)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>

      <span class="counter-badge" id="counter-badge">1 / 3</span>
    </div>
  </div>

  <div class="backdrop-flash" id="backdrop-flash"></div>

<script>
  var photoPaths = [
    'https://picsum.photos/seed/pcpart1/900/700',
    'https://picsum.photos/seed/pcpart2/900/700',
    'https://picsum.photos/seed/pcpart3/900/700',
  ];
  var currentIndex = null;
  var root = document.getElementById('lightbox-root');
  var img = document.getElementById('lightbox-img');
  var counterBadge = document.getElementById('counter-badge');
  var counterA = document.getElementById('counter-a');
  var log = document.getElementById('event-log');
  var flash = document.getElementById('backdrop-flash');

  function logEvent(msg) { log.textContent = msg; }

  function render() {
    img.src = photoPaths[currentIndex];
    counterBadge.textContent = (currentIndex + 1) + ' / ' + photoPaths.length;
    counterA.textContent = (currentIndex + 1);
  }

  function openLightbox(index) {
    currentIndex = index;
    render();
    document.body.classList.add('lightbox-open');
    logEvent('opened at photo ' + (index + 1));
  }

  function closeLightbox() {
    document.body.classList.remove('lightbox-open');
    currentIndex = null;
  }

  function flashBackdrop() {
    flash.classList.add('show');
    setTimeout(function () { flash.classList.remove('show'); }, 180);
  }

  // Fix (T1): onClick={onClose} directly on DialogContent — this is the
  // backdrop region per Requirement 1, including the empty space the
  // counter badge sits over (the badge has no click handler of its own).
  function handleBackdropClick(event) {
    logEvent('backdrop clicked \u2192 lightbox closes');
    flashBackdrop();
    closeLightbox();
  }

  // Fix (T1): stopPropagation on the image so a click on the photo never
  // bubbles to the backdrop handler above (Requirement 2).
  function handleImageClick(event) {
    event.stopPropagation();
    logEvent('image clicked \u2192 stays open (stopPropagation)');
  }

  // Fix (T1): stopPropagation as the first line of each button's existing
  // handler, so none of the three buttons' clicks reach the backdrop
  // handler (Requirements 3-4) — Close doesn't double-fire, Prev/Next
  // navigate instead of closing.
  function handleClose(event) {
    event.stopPropagation();
    logEvent('Close clicked \u2192 lightbox closes (no double-fire)');
    closeLightbox();
  }

  function handlePrev(event) {
    event.stopPropagation();
    var count = photoPaths.length;
    currentIndex = ((currentIndex - 1) % count + count) % count;
    render();
    logEvent('Previous clicked \u2192 navigated to photo ' + (currentIndex + 1) + ' (lightbox stays open)');
  }

  function handleNext(event) {
    event.stopPropagation();
    var count = photoPaths.length;
    currentIndex = (currentIndex + 1) % count;
    render();
    logEvent('Next clicked \u2192 navigated to photo ' + (currentIndex + 1) + ' (lightbox stays open)');
  }

  document.addEventListener('keydown', function (event) {
    if (currentIndex === null) return;
    if (event.key === 'Escape') { logEvent('Escape \u2192 lightbox closes (Radix, unchanged)'); closeLightbox(); }
    else if (event.key === 'ArrowLeft') handlePrev(event);
    else if (event.key === 'ArrowRight') handleNext(event);
  });
</script>
</body>
</html>
