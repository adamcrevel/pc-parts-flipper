<script>
/* =========================================================================

/* ---- Seed Purchases (one per accepted listing) ---------------------- */

/* ---- Seed Parts (generated by P1 and P2's already-completed teardowns) */
function mkPart(purchaseId, category, description, estValue, status) {

const p1cpu = mkPart('P1', 'CPU', 'Intel Core i3-9100', 50, 'sold');

const p1ram = mkPart('P1', 'RAM', '8GB DDR4', 15, 'sold');
p1ram.saleListing = { platform: 'ebay', title: '8GB DDR4 RAM Stick — Pulled, Tested', description: 'Single 8GB DDR4 stick, tested in two boards.', askingPrice: 19, listedAt: '2026-09-06' };

const p1ssd = mkPart('P1', 'Storage', '256GB SATA SSD', 20, 'sold');
p1ssd.saleListing = { platform: 'facebook_marketplace', title: '256GB SSD — Wiped & Tested', description: 'Securely wiped, tested with CrystalDiskInfo, 100% health.', askingPrice: 27, listedAt: '2026-09-07' };
p1ssd.sale = { soldPrice: 28, soldDate: '2026-09-10', fee: 3.00, shipping: 4.00, buyerNote: 'Local pickup.' };

const p2cpu = mkPart('P2', 'CPU', 'Xeon E5-2650', 80, 'ready_to_list');
const p2ram = mkPart('P2', 'RAM', '32GB DDR3 ECC (2x16)', 60, 'listed');
p2ram.saleListing = { platform: 'ebay', title: '32GB DDR3 ECC Server RAM (2x16GB)', description: 'Pulled from a working Xeon workstation, tested in pairs.', askingPrice: 65, listedAt: '2026-09-15' };
const p2mobo = mkPart('P2', 'Motherboard', 'Workstation board (Supermicro X9, confirmed on teardown)', 50, 'sold');
p2mobo.saleListing = { platform: 'ebay', title: 'Supermicro X9 Workstation Motherboard', description: 'Confirmed model on teardown — differs from the original listing. POST tested.', askingPrice: 50, listedAt: '2026-09-16' };
p2mobo.sale = { soldPrice: 48, soldDate: '2026-09-20', fee: 4.00, shipping: 6.00, buyerNote: '' };
const p2case = mkPart('P2', 'Case', 'Full tower', 15, 'ready_to_list');
const p2gpu = mkPart('P2', 'GPU', 'GT 710 (additional part found, not on original listing)', 25, 'unsellable');
p2gpu.unsellableReason = 'DOA — will not display, no POST on 3 test boards.';
DB.parts.push(p2cpu, p2ram, p2mobo, p2case, p2gpu);

// Record the completed teardown reconciliation for P1 and P2 so the detail
// screens can show history even though the checklist itself is read-only now.
DB.purchases.find(p => p.id === 'P1').teardownResults = {
  results: DB.purchases.find(p => p.id === 'P1').expectedParts.map(ep => ({ expectedPartId: ep.id, result: 'present_as_expected', note: '' })),
  additionalParts: [],
};
DB.purchases.find(p => p.id === 'P2').teardownResults = {
  results: [
    { expectedPartId: DB.listings.find(l => l.id==='L4').expectedParts[0].id, result: 'present_as_expected', note: '' },
    { expectedPartId: DB.listings.find(l => l.id==='L4').expectedParts[1].id, result: 'present_as_expected', note: '' },
    { expectedPartId: DB.listings.find(l => l.id==='L4').expectedParts[2].id, result: 'present_but_different', note: 'Different workstation board model than listed (Supermicro X9), still functional.' },
    { expectedPartId: DB.listings.find(l => l.id==='L4').expectedParts[3].id, result: 'missing', note: '' },
    { expectedPartId: DB.listings.find(l => l.id==='L4').expectedParts[4].id, result: 'present_as_expected', note: '' },
  ],
  additionalParts: [ { category: 'GPU', description: 'GT 710 (additional part found, not on original listing)', estValue: 25 } ],
};

/* =========================================================================
   SMALL HELPERS — money formatting, badges, validation
   ========================================================================= */
const money = (n) => `$${Number(n || 0).toFixed(2)}`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const BADGE = {
  open: 'bg-slate-100 text-slate-700', accepted: 'bg-emerald-100 text-emerald-700', rejected: 'bg-red-100 text-red-700',
  ordered: 'bg-blue-100 text-blue-700', shipped: 'bg-indigo-100 text-indigo-700', received: 'bg-purple-100 text-purple-700',
  torn_down: 'bg-amber-100 text-amber-700', closed: 'bg-slate-200 text-slate-700',
  ready_to_list: 'bg-slate-100 text-slate-700', listed: 'bg-blue-100 text-blue-700', sold: 'bg-emerald-100 text-emerald-700', unsellable: 'bg-red-100 text-red-700',
  partial: 'bg-amber-100 text-amber-700', final: 'bg-emerald-100 text-emerald-700', inactive: 'bg-slate-100 text-slate-400',
};
function badge(status, label) {
  const cls = BADGE[status] || 'bg-slate-100 text-slate-700';
  return `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium ${cls}">${esc(label ?? status)}</span>`;
}

// Required-field / non-negative-money validation shared by every form.
// Returns a map of fieldName -> error message; empty object means valid.
function validateFields(spec) {
  const errors = {};
  for (const [field, rule] of Object.entries(spec)) {
    const { value, required, money: isMoney, label } = rule;
    if (required && (value === '' || value === null || value === undefined)) {
      errors[field] = `${label} is required.`;
      continue;
    }
    if (isMoney && value !== '' && value !== null && value !== undefined) {
      const n = Number(value);
      if (Number.isNaN(n)) errors[field] = `${label} must be a number.`;
      else if (n < 0) errors[field] = `${label} cannot be negative.`;
    }
  }
  return errors;
}
function fieldError(errors, name) {
  return errors[name] ? `<p class="mt-1 text-xs text-red-600">${esc(errors[name])}</p>` : '';
}
function fieldClass(errors, name) {
  return errors[name] ? 'border-red-500 focus:ring-red-500 focus:border-red-500' : 'border-slate-300 focus:ring-slate-400 focus:border-slate-400';
}

/* =========================================================================
   ROUTER
   ========================================================================= */
const NAV = [
  { href: '#/sources', label: 'Sources', icon: 'M3 7l9-4 9 4-9 4-9-4zm0 6l9 4 9-4M3 13l9 4 9-4' },
  { href: '#/listings', label: 'Listings', icon: 'M4 6h16M4 12h16M4 18h7' },
  { href: '#/parts', label: 'Parts', icon: 'M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4' },
  { href: '#/dashboard', label: 'Dashboard', icon: 'M3 3v18h18M7 15l4-6 3 4 5-8' },
];

function renderNav() {
  const hash = location.hash || '#/sources';
  const current = '#/' + hash.slice(2).split('/')[0];
  document.getElementById('sidebar-nav').innerHTML = NAV.map(item => `
    <a href="${item.href}" class="flex items-center gap-3 px-3 py-2 rounded-md text-slate-600 hover:bg-slate-50 text-sm ${current === item.href ? 'nav-active' : ''}">
      <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${item.icon}"/></svg>
      ${item.label}
    </a>`).join('');
}

function setHeader(title, subtitle, actionsHtml) {
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-subtitle').textContent = subtitle || '';
  document.getElementById('page-actions').innerHTML = actionsHtml || '';
}

function route() {
  renderNav();
  closeModal();
  const hash = (location.hash || '#/sources').slice(2); // strip "#/"
  const parts = hash.split('/');
  const app = document.getElementById('app');
  if (parts[0] === 'sources') { app.innerHTML = renderSourcesScreen(); bindSourcesScreen(); }
  else if (parts[0] === 'listings' && parts[1] === 'new') { app.innerHTML = renderListingForm(null); bindListingForm(null); }
  else if (parts[0] === 'listings' && parts[1] === 'edit') { app.innerHTML = renderListingForm(parts[2]); bindListingForm(parts[2]); }
  else if (parts[0] === 'listings') { app.innerHTML = renderListingsQueue(); bindListingsQueue(); }
  else if (parts[0] === 'purchases' && parts[2] === 'teardown') { app.innerHTML = renderTeardown(parts[1]); bindTeardown(parts[1]); }
  else if (parts[0] === 'purchases') { app.innerHTML = renderPurchaseDetail(parts[1]); bindPurchaseDetail(parts[1]); }
  else if (parts[0] === 'parts') { app.innerHTML = renderPartsScreen(); bindPartsScreen(); }
  else if (parts[0] === 'dashboard') { app.innerHTML = renderDashboard(); bindDashboard(); }
  else { location.hash = '#/sources'; }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* =========================================================================
   MODAL HELPER
   ========================================================================= */
function openModal(html) {
  document.getElementById('modal-root').innerHTML = `
    <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4" id="modal-overlay">
      <div class="bg-white rounded-lg shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto" id="modal-panel">${html}</div>
    </div>`;
  document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') closeModal(); });
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

/* =========================================================================
   SOURCES SCREEN  (Req 1)
   ========================================================================= */
function renderSourcesScreen() {
  setHeader('Sources', 'Where candidate listings come from.', `
    <button id="btn-new-source" class="inline-flex items-center gap-1.5 bg-slate-900 text-white text-sm font-medium rounded-md px-3 py-2 hover:bg-slate-800">
      + New Source
    </button>`);
  const rows = DB.sources.map(s => `
    <tr class="border-b border-slate-100 hover:bg-slate-50 ${!s.active ? 'opacity-50' : ''}">
      <td class="py-3 px-4 font-medium text-slate-900">${esc(s.name)}</td>
      <td class="py-3 px-4">${esc(PLATFORMS.find(p => p.value === s.platform)?.label || s.platform)}</td>
      <td class="py-3 px-4"><a href="${esc(s.url)}" target="_blank" class="text-blue-600 hover:underline truncate block max-w-[220px]">${esc(s.url)}</a></td>
      <td class="py-3 px-4 text-slate-500 max-w-[260px] truncate" title="${esc(s.notes)}">${esc(s.notes) || '—'}</td>
      <td class="py-3 px-4">${badge(s.active ? 'accepted' : 'inactive', s.active ? 'Active' : 'Inactive')}</td>
      <td class="py-3 px-4 text-right whitespace-nowrap">
        <button data-edit-source="${s.id}" class="text-slate-600 hover:text-slate-900 text-xs font-medium mr-3">Edit</button>
        <button data-toggle-source="${s.id}" class="text-xs font-medium ${s.active ? 'text-red-600 hover:text-red-700' : 'text-emerald-600 hover:text-emerald-700'}">${s.active ? 'Deactivate' : 'Reactivate'}</button>
      </td>
    </tr>`).join('');
  return `
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
          <tr><th class="text-left py-2.5 px-4 font-medium">Name</th><th class="text-left py-2.5 px-4 font-medium">Platform</th><th class="text-left py-2.5 px-4 font-medium">URL</th><th class="text-left py-2.5 px-4 font-medium">Notes</th><th class="text-left py-2.5 px-4 font-medium">Status</th><th></th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function sourceFormHtml(source, errors = {}) {
  const isEdit = !!source;
  const s = source || { name: '', platform: 'ebay', url: '', notes: '' };
  return `
    <div class="p-6">
      <h2 class="text-base font-semibold mb-4">${isEdit ? 'Edit Source' : 'New Source'}</h2>
      <form id="source-form" novalidate>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">Name</label>
          <input name="name" value="${esc(s.name)}" class="w-full rounded-md border px-3 py-2 text-sm ${fieldClass(errors,'name')}" />
          ${fieldError(errors, 'name')}
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">Platform type</label>
          <select name="platform" class="w-full rounded-md border px-3 py-2 text-sm ${fieldClass(errors,'platform')}">
            ${PLATFORMS.map(p => `<option value="${p.value}" ${s.platform === p.value ? 'selected' : ''}>${p.label}</option>`).join('')}
          </select>
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1">URL</label>
          <input name="url" value="${esc(s.url)}" class="w-full rounded-md border px-3 py-2 text-sm ${fieldClass(errors,'url')}" />
          ${fieldError(errors, 'url')}
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1">Notes</label>
          <textarea name="notes" rows="3" class="w-full rounded-md border px-3 py-2 text-sm border-slate-300">${esc(s.notes)}</textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" id="source-cancel" class="px-3 py-2 text-sm font-medium rounded-md border border-slate-300 hover:bg-slate-50">Cancel</button>
          <button type="submit" class="px-3 py-2 text-sm font-medium rounded-md bg-slate-900 text-white hover:bg-slate-800">${isEdit ? 'Save Changes' : 'Create Source'}</button>
        </div>
      </form>
    </div>`;
}

function bindSourcesScreen() {
  document.getElementById('btn-new-source').onclick = () => openSourceModal(null);
  document.querySelectorAll('[data-edit-source]').forEach(btn => btn.onclick = () => openSourceModal(btn.dataset.editSource));
  document.querySelectorAll('[data-toggle-source]').forEach(btn => btn.onclick = () => {
    const src = DB.sources.find(s => s.id === btn.dataset.toggleSource);
    src.active = !src.active;
    route();
  });
}

function openSourceModal(id, errors = {}) {
  const source = id ? DB.sources.find(s => s.id === id) : null;
  openModal(sourceFormHtml(source, errors));
  document.getElementById('source-cancel').onclick = closeModal;
  document.getElementById('source-form').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const vals = { name: fd.get('name').trim(), platform: fd.get('platform'), url: fd.get('url').trim(), notes: fd.get('notes').trim() };
    const errs = validateFields({
      name: { value: vals.name, required: true, label: 'Name' },
      url: { value: vals.url, required: true, label: 'URL' },
    });
    if (Object.keys(errs).length) { openSourceModal(id, errs); return; }
    if (id) { Object.assign(source, vals); }
    else { DB.sources.push({ id: uid('src'), active: true, ...vals }); }
    closeModal();
    route();
  };
}

draftExpectedParts.__key = undefined;

          <div class="col-span-2">

            <p class="mt-1 text-xs text-red-600 hidden" id="err-feesShipping"></p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Listing date</label>
            <input name="listingDate" type="date" value="${listing?.listingDate || ''}" class="w-full rounded-md border px-3 py-2 text-sm border-slate-300" id="f-listingDate" />

          </div>

      </div>

        <div class="flex items-center justify-between mb-4">
          <h2 class="text-sm font-semibold text-slate-900">Expected Parts</h2>
          <button type="button" id="btn-add-part" class="text-xs font-medium text-blue-600 hover:text-blue-700">+ Add Part</button>

function expectedPartRowHtml(part, index) {
  return `
  <div class="flex items-start gap-2 border border-slate-200 rounded-md p-2.5" data-part-row="${index}">
    <select data-part-field="category" data-index="${index}" class="rounded-md border border-slate-300 px-2 py-1.5 text-xs w-32">
      ${CATEGORIES.map(c => `<option value="${c}" ${part.category === c ? 'selected' : ''}>${c}</option>`).join('')}
    </select>
    <input data-part-field="description" data-index="${index}" value="${esc(part.description)}" placeholder="Description / model" class="flex-1 rounded-md border border-slate-300 px-2 py-1.5 text-xs" />
    <div class="w-28">
      <div class="relative">
        <span class="absolute left-2 top-1.5 text-xs text-slate-400">$</span>
        <input data-part-field="estValue" data-index="${index}" type="number" step="0.01" value="${part.estValue}" class="w-full rounded-md border border-slate-300 pl-5 pr-2 py-1.5 text-xs" />
      </div>
    </div>
    <button type="button" data-remove-part="${index}" class="text-slate-400 hover:text-red-600 px-1" title="Remove">✕</button>
  </div>`;
}

function renderExpectedPartsRows() {
  const container = document.getElementById('expected-parts-rows');
  if (!container) return;
  container.innerHTML = draftExpectedParts.length
    ? draftExpectedParts.map((p, i) => expectedPartRowHtml(p, i)).join('')
    : '<p class="text-xs text-slate-400 italic">No expected parts added yet.</p>';
  container.querySelectorAll('[data-part-field]').forEach(el => {
    el.onchange = () => { draftExpectedParts[+el.dataset.index][el.dataset.partField] = el.dataset.partField === 'estValue' ? el.value : el.value; renderComparison(); };
  });
  container.querySelectorAll('[data-remove-part]').forEach(btn => {
    btn.onclick = () => { draftExpectedParts.splice(+btn.dataset.removePart, 1); renderExpectedPartsRows(); renderComparison(); };
  });
}

function renderComparison() {
  const box = document.getElementById('comparison-box');
  if (!box) return;
  const asking = Number(document.getElementById('f-askingPrice')?.value || 0);
  const fees = Number(document.getElementById('f-feesShipping')?.value || 0);
  const totalCost = asking + fees;
  const totalExpected = draftExpectedParts.reduce((sum, p) => sum + Number(p.estValue || 0), 0);
  const delta = totalExpected - totalCost;
  box.innerHTML = `
    <dl class="space-y-2 text-sm">
      <div class="flex justify-between"><dt class="text-slate-500">Expected parts value</dt><dd class="font-medium">${money(totalExpected)}</dd></div>
      <div class="flex justify-between"><dt class="text-slate-500">Asking price</dt><dd class="font-medium">${money(asking)}</dd></div>
      <div class="flex justify-between"><dt class="text-slate-500">Est. fees / shipping</dt><dd class="font-medium">${money(fees)}</dd></div>
      <div class="flex justify-between border-t border-slate-200 pt-2"><dt class="text-slate-500">Total cost</dt><dd class="font-medium">${money(totalCost)}</dd></div>
    </dl>
    <div class="mt-4 rounded-md px-3 py-2.5 text-sm font-semibold ${delta >= 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'}">
      ${delta >= 0 ? 'Potential margin' : 'Potential loss'}: ${money(Math.abs(delta))}
    </div>`;
}

function bindListingForm(id) {
  const listing = id ? DB.listings.find(l => l.id === id) : null;
  renderExpectedPartsRows();
  renderComparison();
  ['f-askingPrice', 'f-feesShipping'].forEach(fid => document.getElementById(fid).addEventListener('input', renderComparison));
  document.getElementById('btn-add-part').onclick = () => { draftExpectedParts.push({ id: uid('ep'), category: 'CPU', description: '', estValue: 0 }); renderExpectedPartsRows(); renderComparison(); };

  const photoPreview = document.getElementById('photo-preview');
  let photos = listing ? [...listing.photos] : [];
  const renderPhotos = () => {
    photoPreview.innerHTML = photos.map((p, i) => `
      <div class="relative">
        <img src="${p.url}" class="w-16 h-16 object-cover rounded-md border border-slate-200" />
        <button type="button" data-remove-photo="${i}" class="absolute -top-1.5 -right-1.5 w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] leading-4">✕</button>
      </div>`).join('');
    photoPreview.querySelectorAll('[data-remove-photo]').forEach(btn => btn.onclick = () => { photos.splice(+btn.dataset.removePhoto, 1); renderPhotos(); });
  };
  renderPhotos();
  document.getElementById('photo-input').onchange = (e) => {
    Array.from(e.target.files).forEach(file => photos.push({ name: file.name, url: URL.createObjectURL(file) }));
    renderPhotos();
  };

  document.getElementById('listing-form').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const vals = {
      sourceId: fd.get('sourceId'), title: fd.get('title').trim(), description: fd.get('description').trim(),
      url: fd.get('url').trim(), askingPrice: fd.get('askingPrice'), feesShipping: fd.get('feesShipping') || 0,
      listingDate: fd.get('listingDate'),
    };
    const errs = validateFields({
      title: { value: vals.title, required: true, label: 'Title' },
      askingPrice: { value: vals.askingPrice, required: true, money: true, label: 'Asking price' },
      feesShipping: { value: vals.feesShipping, money: true, label: 'Fees / shipping' },
      listingDate: { value: vals.listingDate, required: true, label: 'Listing date' },
    });
    // Clear and reapply inline errors for the plain (non-modal) fields on this screen.
    ['title', 'askingPrice', 'feesShipping', 'listingDate'].forEach(f => {
      const el = document.getElementById('err-' + f);
      if (!el) return;
      if (errs[f]) { el.textContent = errs[f]; el.classList.remove('hidden'); document.getElementById('f-' + f).classList.add('border-red-500'); }
      else { el.classList.add('hidden'); document.getElementById('f-' + f)?.classList.remove('border-red-500'); }
    });
    if (draftExpectedParts.some(p => !p.description.trim() || Number(p.estValue) < 0)) {
      document.getElementById('err-expectedParts').textContent = 'Every expected part needs a description and a non-negative estimated value.';
      document.getElementById('err-expectedParts').classList.remove('hidden');
      errs.expectedParts = true;
    } else {
      document.getElementById('err-expectedParts').classList.add('hidden');
    }
    if (Object.keys(errs).length) return;

    vals.askingPrice = Number(vals.askingPrice);
    vals.feesShipping = Number(vals.feesShipping);
    const finalParts = draftExpectedParts.map(p => ({ ...p, estValue: Number(p.estValue) }));
    if (listing) {
      Object.assign(listing, vals, { expectedParts: finalParts, photos });
    } else {
      DB.listings.push({ id: uid('L'), status: 'open', ...vals, expectedParts: finalParts, photos });
    }
    draftExpectedParts = [];
    location.hash = '#/listings';
  };
}

const queueState = { status: 'all', sourceId: 'all', page: 1 };
const PAGE_SIZE = 3;

function renderListingsQueue() {
  setHeader('Listings Queue', 'Every candidate listing across all sources.', `
    <a href="#/listings/new" class="inline-flex items-center gap-1.5 bg-slate-900 text-white text-sm font-medium rounded-md px-3 py-2 hover:bg-slate-800">+ New Listing</a>`);

  let filtered = DB.listings.filter(l =>
    (queueState.status === 'all' || l.status === queueState.status) &&
    (queueState.sourceId === 'all' || l.sourceId === queueState.sourceId));
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  queueState.page = Math.min(queueState.page, totalPages);
  const pageItems = filtered.slice((queueState.page - 1) * PAGE_SIZE, queueState.page * PAGE_SIZE);

  const rows = pageItems.map(l => {

      <td class="py-3 px-4 font-medium ${delta >= 0 ? 'text-emerald-600' : 'text-red-600'}">${delta >= 0 ? '+' : '−'}${money(Math.abs(delta))}</td>

        ${l.status === 'accepted' && purchase ? `<a href="#/purchases/${purchase.id}" class="text-blue-600 hover:text-blue-700 text-xs font-medium">View Purchase →</a>` : ''}

  }).join('') || `<tr><td colspan="6" class="py-10 text-center text-slate-400">No listings match these filters.</td></tr>`;

        ${['all','open','accepted','rejected'].map(s => `<option value="${s}" ${queueState.status===s?'selected':''}>${s==='all'?'All statuses':s[0].toUpperCase()+s.slice(1)}</option>`).join('')}
      </select>
      <select id="filter-source" class="rounded-md border border-slate-300 px-2.5 py-1.5 text-xs">
        <option value="all" ${queueState.sourceId==='all'?'selected':''}>All sources</option>
        ${DB.sources.map(s => `<option value="${s.id}" ${queueState.sourceId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
      </select>
      <span class="text-xs text-slate-400 ml-auto">${filtered.length} listing${filtered.length===1?'':'s'}</span>

      <span class="text-xs text-slate-500">Page ${queueState.page} of ${totalPages}</span>
      <button id="page-next" ${queueState.page>=totalPages?'disabled':''} class="text-xs font-medium px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-50">Next →</button>
    </div>
  </div>`;
}

function bindListingsQueue() {
  document.getElementById('filter-status').onchange = (e) => { queueState.status = e.target.value; queueState.page = 1; route(); };
  document.getElementById('filter-source').onchange = (e) => { queueState.sourceId = e.target.value; queueState.page = 1; route(); };
  document.getElementById('page-prev').onclick = () => { queueState.page--; route(); };
  document.getElementById('page-next').onclick = () => { queueState.page++; route(); };
  document.querySelectorAll('[data-accept]').forEach(btn => btn.onclick = () => acceptListing(btn.dataset.accept));
  document.querySelectorAll('[data-reject]').forEach(btn => btn.onclick = () => { DB.listings.find(l => l.id === btn.dataset.reject).status = 'rejected'; route(); });
}

// Accepting a Listing creates a linked Purchase pre-filled with the Listing's
// price and Expected Parts (Req 4).
function acceptListing(listingId) {
  const listing = DB.listings.find(l => l.id === listingId);
  listing.status = 'accepted';
  const purchase = {
    id: uid('P'), listingId: listing.id, status: 'ordered',
    pricePaid: listing.askingPrice, purchaseDate: new Date().toISOString().slice(0, 10),
    expectedParts: listing.expectedParts, teardownResults: null, additionalParts: [],
  };
  DB.purchases.push(purchase);
  location.hash = `#/purchases/${purchase.id}`;
}

function renderAdditionalRows() {
  const container = document.getElementById('additional-rows');
  if (!container) return;
  container.innerHTML = draftAdditionalParts.length ? draftAdditionalParts.map((p, i) => expectedPartRowHtml(p, i)).join('') : '<p class="text-xs text-slate-400 italic">None found.</p>';
  container.querySelectorAll('[data-part-field]').forEach(el => el.onchange = () => { draftAdditionalParts[+el.dataset.index][el.dataset.partField] = el.value; });
  container.querySelectorAll('[data-remove-part]').forEach(btn => btn.onclick = () => { draftAdditionalParts.splice(+btn.dataset.removePart, 1); renderAdditionalRows(); });
}

function bindTeardown(purchaseId) {
  const purchase = DB.purchases.find(p => p.id === purchaseId);
  if (purchase.status === 'torn_down' || purchase.status === 'closed') return; // read-only record, nothing to bind

  renderAdditionalRows();
  document.getElementById('btn-add-additional').onclick = () => { draftAdditionalParts.push({ id: uid('ap'), category: 'Other', description: '', estValue: 0 }); renderAdditionalRows(); };

  purchase.expectedParts.forEach(ep => {
    document.querySelectorAll(`input[name="result-${ep.id}"]`).forEach(radio => {
      radio.onchange = () => {
        const noteInput = document.querySelector(`[data-note-for="${ep.id}"]`);
        noteInput.classList.toggle('hidden', radio.value !== 'present_but_different' || !radio.checked);
      };
    });
  });

  document.getElementById('teardown-form').onsubmit = (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const results = [];
    let hasError = false;
    purchase.expectedParts.forEach(ep => {
      const result = fd.get(`result-${ep.id}`);
      const note = (fd.get(`note-${ep.id}`) || '').trim();
      const errEl = document.querySelector(`[data-note-error="${ep.id}"]`);
      if (result === 'present_but_different' && !note) {
        errEl.classList.remove('hidden');
        document.querySelector(`[data-note-for="${ep.id}"]`).classList.add('border-red-500');
        hasError = true;
      } else {
        errEl.classList.add('hidden');
      }
      results.push({ expectedPartId: ep.id, result, note });
    });
    if (hasError) return;

    const additionalParts = draftAdditionalParts.map(p => ({ category: p.category, description: p.description, estValue: Number(p.estValue) }));
    purchase.teardownResults = { results, additionalParts };
    purchase.additionalParts = additionalParts;
    purchase.status = 'torn_down';

    // Generate a Part record for every part marked present_as_expected,
    // present_but_different, or additional (Req 6). Missing parts generate nothing.
    results.forEach(r => {
      if (r.result === 'missing') return;
      const ep = purchase.expectedParts.find(x => x.id === r.expectedPartId);
      DB.parts.push({ id: uid('pt'), purchaseId: purchase.id, category: ep.category, description: ep.description, estValue: ep.estValue, status: 'ready_to_list', unsellableReason: null, saleListing: null, sale: null });
    });
    additionalParts.forEach(p => {
      DB.parts.push({ id: uid('pt'), purchaseId: purchase.id, category: p.category, description: p.description, estValue: p.estValue, status: 'ready_to_list', unsellableReason: null, saleListing: null, sale: null });
    });

    draftAdditionalParts = [];
    location.hash = `#/purchases/${purchase.id}`;
  };
}

const DASH_PAGE_SIZE = 3;

function purchaseFinancials(purchase) {
  const parts = DB.parts.filter(p => p.purchaseId === purchase.id);
  const soldParts = parts.filter(p => p.status === 'sold');
  const revenue = soldParts.reduce((s, p) => s + p.sale.soldPrice, 0);
  const feesShipping = soldParts.reduce((s, p) => s + p.sale.fee + p.sale.shipping, 0);
  const net = revenue - feesShipping - purchase.pricePaid;
  const isFinal = parts.length > 0 && parts.every(p => p.status === 'sold');
  return { parts, soldParts, revenue, feesShipping, net, isFinal };
}

function renderDashboard() {
  setHeader('Profit Dashboard', 'Net profit per purchase (lot) — cost is never allocated per part (A1).', '');
  let rows = DB.purchases.map(p => ({ purchase: p, ...purchaseFinancials(p) }));
  if (dashState.status !== 'all') rows = rows.filter(r => dashState.status === 'partial' ? !r.isFinal : r.isFinal);
  rows.sort((a, b) => dashState.sort === 'net_desc' ? b.net - a.net : dashState.sort === 'net_asc' ? a.net - b.net : b.purchase.pricePaid - a.purchase.pricePaid);

  const totalPages = Math.max(1, Math.ceil(rows.length / DASH_PAGE_SIZE));
  dashState.page = Math.min(dashState.page, totalPages);
  const pageRows = rows.slice((dashState.page - 1) * DASH_PAGE_SIZE, dashState.page * DASH_PAGE_SIZE);

  const body = pageRows.map(({ purchase, parts, soldParts, revenue, feesShipping, net, isFinal }) => {
    const listing = DB.listings.find(l => l.id === purchase.listingId);
    return `
    <tr class="border-b border-slate-100 hover:bg-slate-50">
      <td class="py-3 px-4"><a href="#/purchases/${purchase.id}" class="font-medium text-blue-600 hover:underline">${purchase.id}</a><div class="text-xs text-slate-500">${esc(listing.title)}</div></td>
      <td class="py-3 px-4">${badge(purchase.status, purchase.status.replace(/_/g,' '))}</td>
      <td class="py-3 px-4">${money(purchase.pricePaid)}</td>
      <td class="py-3 px-4">${soldParts.length} / ${parts.length || 0}</td>
      <td class="py-3 px-4">${money(revenue)}</td>
      <td class="py-3 px-4">${money(feesShipping)}</td>
      <td class="py-3 px-4 font-semibold ${net >= 0 ? 'text-emerald-600' : 'text-red-600'}">${net >= 0 ? '+' : '−'}${money(Math.abs(net))}</td>
      <td class="py-3 px-4">${badge(isFinal ? 'final' : 'partial', isFinal ? 'Final' : 'Partial / Running')}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" class="py-10 text-center text-slate-400">No purchases match these filters.</td></tr>`;

  return `
  <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
    <div class="flex items-center gap-3 p-4 border-b border-slate-200">
      <select id="dash-filter-status" class="rounded-md border border-slate-300 px-2.5 py-1.5 text-xs">
        <option value="all" ${dashState.status==='all'?'selected':''}>All purchases</option>
        <option value="partial" ${dashState.status==='partial'?'selected':''}>Partial / Running</option>
        <option value="final" ${dashState.status==='final'?'selected':''}>Final</option>
      </select>
      <select id="dash-sort" class="rounded-md border border-slate-300 px-2.5 py-1.5 text-xs">
        <option value="net_desc" ${dashState.sort==='net_desc'?'selected':''}>Sort: Net profit (high → low)</option>
        <option value="net_asc" ${dashState.sort==='net_asc'?'selected':''}>Sort: Net profit (low → high)</option>
        <option value="price_desc" ${dashState.sort==='price_desc'?'selected':''}>Sort: Price paid (high → low)</option>
      </select>
      <span class="text-xs text-slate-400 ml-auto">${rows.length} purchase${rows.length===1?'':'s'}</span>
    </div>
    <table class="w-full text-sm">
      <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
        <tr><th class="text-left py-2.5 px-4 font-medium">Purchase</th><th class="text-left py-2.5 px-4 font-medium">Status</th><th class="text-left py-2.5 px-4 font-medium">Price Paid</th><th class="text-left py-2.5 px-4 font-medium">Parts Sold</th><th class="text-left py-2.5 px-4 font-medium">Revenue</th><th class="text-left py-2.5 px-4 font-medium">Fees + Shipping</th><th class="text-left py-2.5 px-4 font-medium">Net Profit</th><th class="text-left py-2.5 px-4 font-medium">Flag</th></tr>
      </thead>
      <tbody>${body}</tbody>
    </table>
    <div class="flex items-center justify-between px-4 py-3 border-t border-slate-200">
      <button id="dash-prev" ${dashState.page<=1?'disabled':''} class="text-xs font-medium px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-50">← Prev</button>
      <span class="text-xs text-slate-500">Page ${dashState.page} of ${totalPages}</span>
      <button id="dash-next" ${dashState.page>=totalPages?'disabled':''} class="text-xs font-medium px-2 py-1 rounded border border-slate-300 disabled:opacity-40 hover:bg-slate-50">Next →</button>
    </div>
  </div>`;
}

function bindDashboard() {
  document.getElementById('dash-filter-status').onchange = (e) => { dashState.status = e.target.value; dashState.page = 1; route(); };
  document.getElementById('dash-sort').onchange = (e) => { dashState.sort = e.target.value; route(); };
  document.getElementById('dash-prev').onclick = () => { dashState.page--; route(); };
  document.getElementById('dash-next').onclick = () => { dashState.page++; route(); };
}

/* =========================================================================
   BOOT
   ========================================================================= */
route();
</script>
</body>
</html>
